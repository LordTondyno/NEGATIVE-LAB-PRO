<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Negativ → Pozitiv</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Negativ na pozitiv</h1>
  <div class="bar">
    <label class="btn" for="file">Otevřít sken</label>
    <input id="file" type="file" accept="image/*,.tif,.tiff" hidden>
    <button id="toggle" class="btn" disabled>Zobrazit negativ</button>
    <button id="export" class="btn primary" disabled>Exportovat</button>
  </div>
</header>
<main>
  <section id="stage" aria-label="Náhled">
    <canvas id="view" hidden></canvas>
    <p id="hint">Přetáhni sem sken negativu (JPG, PNG, TIFF).<br>Soubory se nikam nenahrávají, vše běží v tvém prohlížeči.</p>
  </section>
  <aside id="panel">
    <div class="row">
      <label><input type="radio" name="mode" value="color" checked> Barevný</label>
      <label><input type="radio" name="mode" value="bw"> Černobílý</label>
    </div>
    <div class="row">
      <button id="auto" class="btn" disabled>Automatický film base</button>
      <span class="note">Nebo zobraz negativ a klikni pipetou na nenaexponovaný okraj filmu.</span>
    </div>
    <div id="sliders"></div>
    <button id="reset" class="btn">Obnovit nastavení</button>
  </aside>
</main>
<script src="https://cdn.jsdelivr.net/npm/utif@3.1.0/UTIF.js"></script>
<script src="app.js"></script>
</body>
</html>
